<section class="stats-section">
  <div class="container">
    <div class="stats-inner">

      <div class="stats-grid">

        <div class="stat-card">
          <div class="stat-icon-wrap">
            <i class="fa-solid fa-pills"></i>
          </div>
          <div class="stat-content">
            <span class="stat-num">{{ formatNumber(medicinesCount) }}</span>
            <span class="stat-label">Medicines Listed</span>
          </div>
        </div>

        <div class="stat-card">
          <div class="stat-icon-wrap">
            <i class="fa-solid fa-hospital"></i>
          </div>
          <div class="stat-content">
            <span class="stat-num">{{ formatNumber(pharmaciesCount) }}</span>
            <span class="stat-label">Partner Pharmacies</span>
          </div>
        </div>

        <div class="stat-card stat-card--soon">
          <div class="stat-icon-wrap">
            <i class="fa-solid fa-magnifying-glass"></i>
          </div>
          <div class="stat-content">
            <span class="stat-num stat-num--soon">
              <span class="soon-dots">
                <span></span><span></span><span></span>
              </span>
            </span>
            <span class="stat-label">Monthly Searches</span>
            <span class="soon-badge">Coming Soon</span>
          </div>
        </div>

        <div class="stat-card stat-card--soon">
          <div class="stat-icon-wrap">
            <i class="fa-solid fa-circle-check"></i>
          </div>
          <div class="stat-content">
            <span class="stat-num stat-num--soon">
              <span class="soon-dots">
                <span></span><span></span><span></span>
              </span>
            </span>
            <span class="stat-label">Availability Rate</span>
            <span class="soon-badge">Coming Soon</span>
          </div>
        </div>

      </div>

      <div class="stats-bg-orb stats-bg-orb-1"></div>
      <div class="stats-bg-orb stats-bg-orb-2"></div>

    </div>
  </div>
</section>
